<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokning: Spel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bk-games.css">
</head>
<body>
    <header></header>

    <main>
        <section class="centerizer">
            <div class="img-container">
                <img src="images/apex_bg.jpg" alt="">
            </div>
            <div class="grid-container booking-card">
                
                <div id="title" class="card-bg-title"><h1>Din drömspelupplevelse</h1><p>Boka för hela familjen!</p></div>

                <div class="experience card-bg" id="vr">
                    <input type="radio" name="experience-input" id="vr-input" class="experience-input">
                    <label for="vr-input" class="experience-label"><p>VIRTUAL REALITY</p></label>
                </div>

                <div class="experience card-bg" id="arcade">
                    <input type="radio" name="experience-input" id="arcade-input" class="experience-input">
                    <label for="arcade-input" class="experience-label"><p>ARKAD</p></label>
                </div>
                
                <div class="experience card-bg" id="pc-cafe">
                    <input type="radio" name="experience-input" id="pc-cafe-input" class="experience-input">
                    <label for="pc-cafe-input" class="experience-label"><p>SPELCAFÉ</p></label>
                </div>

                <!-- <div class="experience-info card-bg"></div> -->

                <!-- <form class="booking-form card-bg">
                    
                </form> -->
            </div>
        </section>
    </main>

    <footer></footer>
</body>
</html>
