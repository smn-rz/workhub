<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokning: Spel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="games.css">
</head>

<body>
    <main>
        <section class="centerizer">
            <div class="img-container">
                <img src="images/apex_bg.jpg" alt="game image: apex">
            </div>

            <div class="grid-container booking-card">
                <div id="title"><h1>Din drömspelupplevelse</h1><p>Lorem ipsum dolor sit amet.</p></div>

                <div class="experience" id="vr">
                    <input type="radio" name="exp-input" id="vr-input" class="exp-input">
                    <label for="vr-input" class="exp-label"><p>VR – fr. 199 kr</p></label>
                </div>
                <div class="experience" id="arcade">
                    <input type="radio" name="exp-input" id="arcade-input" class="exp-input">
                    <label for="arcade-input" class="exp-label"><p>ARKAD – fr. 149 kr</p>
                    </label>
                </div>
                <div class="experience" id="pc-cafe">
                    <input type="radio" name="exp-input" id="pc-cafe-input" class="exp-input">
                    <label for="pc-cafe-input" class="exp-label"><p>SPELCAFÉ – fr. 129 kr</p></label>
                </div>
            </div>
            
        </section>
    </main>
</body>
