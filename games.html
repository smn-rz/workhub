<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokning: Spel</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="games.css">
    <script src="games.js" defer async></script>
</head>

<body>
    <header>
        <div id="nav-container">
            <a href="#">
                <svg id="workhub" viewbox="0 0 135 20">
                    <use href="images/WorkHub_logo.svg"></use>
                </svg>
            </a>

            <div>
                <svg id="burger" viewbox="0 0 32 20">
                    <use href="images/burger.svg"></use>
                </svg>
            </div>
        </div>
    </header>

    <main>
        <section class="centerizer">


            <!-- <div class="img-container">
                <img src="images/apex_bg.jpg" alt="game image: apex">
            </div> -->

            <div class="grid-container booking-container">
                <div id="title">
                    <h1>VÄLJ DIN SPELUPPLEVELSE</h1>
                    <p>Lorem ipsum dolor sit amet.</p>
                </div>

                <article id="experiences-card" class="grid-container">
                    <button type="button" aria-pressed="false" class="experience" id="${expList.eId}">
                        <h2>
                            ${expList.eTitle}
                        </h2>
                        <span class="price">
                            ${addKr(expList.eHourPrice)}
                            <span class="perPrice"> / person / timme. </span>
                        </span>
                    </button>
                </article>

                <article class="experience-desc-container card-bg">
                    <p id="experience-desc">Välj din upplevelse!</p>
                    <a id="desc-btn" class="btn" href="#games-form">
                        Gå vidare till bokning
                    </a>
                </article>

                <article id="games-form" class="games-form card-bg">
                    <form id="booking-form" class="booking-flex" method="post" novalidate>
                        <div class="booking-flex">
                            <div class="form-group" id="amount-group">
                                <select class="input-field" id="input-amount">
                                    <option value selected hidden>antal besökare*</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <span class="dropdown-arrow"></span>
                                <span class="hidden-label">Besökare</span>
                                <p class="not-valid">Error</p>
                            </div>

                            <div class="form-group" id="duration-group">
                                <select class="input-field" id="input-duration">
                                    <option value selected hidden>antal timmar*</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <span class="dropdown-arrow"></span>
                                <span class="hidden-label">Timmar</span>
                                <p class="not-valid">Error</p>
                            </div>

                            <div class="input-date form-group input-detected" id="date-group">
                                <input type="date" class="input-field" id="input-date">
                                <span class="hidden-label">Datum*</span>
                                <p class="not-valid">Error</p>
                            </div>

                            <div class="time-select" id="time-group">
                                <p class="time-not-valid">Error</p>
                            </div>
                            
                            <div class="form-group" class="input-field" id="name-group">
                                <input type="text" placeholder="Ditt första namn*" class="input-field" id="input-name">
                                <span class="hidden-label">Namn</span>
                                <p class="not-valid">Error</p>
                            </div>

                            <div class="form-group" id="email-group">
                                <input type="email" placeholder="Din e-mail*" class="input-field" id="input-email">
                                <span class="hidden-label">E-mail</span>
                                <p class="not-valid">Error</p>
                            </div>

                            <div class="form-btns form-group">
                                <button id="clear-form" class="btn">Rensa</button>
                                <button type="submit" id="submit-form" class="btn">Granska bokning</button>
                            </div>
                        </div>
                    </form>
                </article>

                <article class="booking-details card-bg" id="detailsScroll">
                    <div class="review-booking">
                        <h2>GRANSKA DIN BOKNING</h2>
                        <div class="customer-details">

                        </div>
                        <button id="finalize-booking" class="btn">Boka</button>
                    </div>
                </article>
            </div>

        </section>
    </main>
</body>
